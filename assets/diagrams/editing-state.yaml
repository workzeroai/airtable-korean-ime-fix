# 편집 상태 추정 규칙: 화면을 읽지 않고 키·클릭으로 상태를 추정한다
# 생성: python ../../../_design/excalidraw_kit.py editing-state.yaml --out . --export
name: editing-state
title: 편집 상태 추정 규칙
subtitle: 스크립트는 화면을 읽지 않고, 누른 키와 클릭으로 상태를 추정한다
layout: horizontal
gapX: 300
nodes:
  - {id: selected, label: "셀 선택 상태\n(글자 키를 가로챔)", role: info, shape: ellipse}
  - {id: editing, label: "편집 중\n(아무것도 안 함)", role: secondary, shape: ellipse}
edges:
  - {from: selected, to: editing, label: "F2 · Enter · 더블클릭\n글자 입력(F2 자동)", route: curve, curve: 0.22}
  - {from: editing, to: selected, label: "Esc · Tab · Enter\n클릭 · 창·탭 전환", route: curve, curve: 0.22}
